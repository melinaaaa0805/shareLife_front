<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">

  <!-- Background -->
  <rect width="512" height="512" fill="#0E0E0E"/>

  <!-- ===== ICON MARK ===== -->
  <!-- 2×2 grid: 120×120 squares, 10px gap, center at (256, 200) -->

  <!-- Pink – top left -->
  <rect x="131" y="75" width="120" height="120" rx="34" fill="#EAB1CF"/>
  <path d="M204 195 A52 52 0 0 1 251 148" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- Yellow – top right -->
  <rect x="261" y="75" width="120" height="120" rx="34" fill="#FFE27A"/>
  <path d="M261 148 A52 52 0 0 1 308 195" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- Purple – bottom left -->
  <rect x="131" y="205" width="120" height="120" rx="34" fill="#9B7BEA"/>
  <path d="M204 205 A52 52 0 0 0 251 252" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- Mint – bottom right -->
  <rect x="261" y="205" width="120" height="120" rx="34" fill="#A6D8C0"/>
  <path d="M308 205 A52 52 0 0 1 261 252" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.5"/>

  <!-- ===== WORDMARK ===== -->
  <text x="256" y="390" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="58" letter-spacing="-1.5" text-anchor="middle">
    <tspan font-weight="400" fill="#F5F5F5">Share</tspan><tspan font-weight="700" fill="#9B7BEA">Life</tspan>
  </text>

</svg>
